# TLS variant, enabled with the docker-compose.tls.yml override.
#
# Why this is an override rather than the default: a self-signed certificate
# makes every browser warn, so forcing it on the quick start would trade a
# working demo for a scary one. In a real deployment TLS usually terminates
# further out — at an ingress controller or load balancer — and this file is
# what that termination looks like when the container has to do it itself.

server {
    listen 80;
    server_name _;

    # Nothing is served over plain HTTP once TLS is on: an attacker who can see
    # the first request can strip the redirect, so the window is closed rather
    # than narrowed.
    #
    # $host carries no port, so this redirects to the standard 443 — correct for
    # a real deployment, but not for the remapped dev ports. Locally, open
    # https://localhost:8443 directly instead of following this redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 is kept for older clients; 1.0 and 1.1 are broken and 1.3 is preferred.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off; # modern clients pick better than a static list
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Every header repeated in full. nginx does not merge add_header directives:
    # a block declaring even one of its own discards every add_header it would
    # otherwise inherit. Adding only HSTS here silently dropped the other four.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Only meaningful over HTTPS, and only once a real certificate is in place:
    # sending it with a self-signed cert would pin browsers to a site they cannot
    # verify. Six months, no preload, until this runs on a real domain.
    add_header Strict-Transport-Security "max-age=15768000" always;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
