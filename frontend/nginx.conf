server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Repeated in full inside every server block on purpose. nginx does not merge
    # add_header directives: a block that declares even one of its own discards
    # every add_header it would otherwise inherit. Defining these once at http
    # level and adding HSTS in the TLS block silently dropped the other four.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The SPA loads no third-party script or style, so the policy can be strict.
    # 'unsafe-inline' for styles only: the bundler emits an inline <style> block.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Swagger UI and the OpenAPI document live outside /api, so they need their
    # own passthrough — otherwise the SPA fallback below would swallow them.
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter keys on this. Without it every caller looks like nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: without this a hard refresh on /words/BBC would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
