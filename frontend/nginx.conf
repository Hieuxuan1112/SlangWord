server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI and the OpenAPI document live outside /api, so they need their
    # own passthrough — otherwise the SPA fallback below would swallow them.
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: without this a hard refresh on /words/BBC would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
