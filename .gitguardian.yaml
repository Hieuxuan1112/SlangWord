version: 2

# Read by ggshield (the CLI used in the CI job below and in pre-commit hooks).
# The GitGuardian dashboard's own GitHub scanning is configured separately in
# its settings — this file does not silence dashboard incidents.
secret:
  ignored-paths:
    # Test fixtures only. These credentials authenticate against a Testcontainers
    # database that exists for the duration of a single test run.
    - "backend/src/test/**"
