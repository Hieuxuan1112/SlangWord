services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slangword
      POSTGRES_USER: slangword
      POSTGRES_PASSWORD: slangword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slangword -d slangword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/slangword
      SPRING_DATASOURCE_USERNAME: slangword
      SPRING_DATASOURCE_PASSWORD: slangword
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-secret-key-at-least-32-bytes-long}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build: ./frontend
    ports:
      # Override with WEB_PORT if 8080 is taken on your machine.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
